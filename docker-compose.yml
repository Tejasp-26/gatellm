services:
  postgres:
    image: pgvector/pgvector:pg16   # Postgres 16 with the pgvector extension included
    environment:
      POSTGRES_USER: gatellm
      POSTGRES_PASSWORD: gatellm
      POSTGRES_DB: gatellm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gatellm -d gatellm"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      LOG_LEVEL: info
      # Inside compose, services reach each other by service name.
      DATABASE_URL: postgres://gatellm:gatellm@postgres:5432/gatellm?sslmode=disable
      REDIS_URL: redis://redis:6379
      ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-admin-token}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
